<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لا إله إلا الله</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ==================== شاشة البداية ==================== -->
    <div id="screen-home" class="screen active">
        <div class="container">
            <h1 class="app-title">لا إله إلا الله</h1>
            <p class="subtitle">تطبيق إسلامي شامل</p>
            <p>من صنع المطور : مصطفي محمود صابر</p>
            
            <div class="buttons-container">
                <button class="main-btn quran-btn" onclick="goToQuranMessage()">
                    📖 القرآن الكريم
                </button>
                <button class="main-btn azkar-btn" onclick="showScreen('screen-azkar-options')">
                    🤲 الأذكار
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== شاشة اختيار الأذكار ==================== -->
    <div id="screen-azkar-options" class="screen">
        <div class="container">
            <h1 class="app-title">الأذكار</h1>
            <p class="subtitle">اختر وقت الذكر</p>
            <div class="azkar-options">
                <button class="main-btn morning-btn" onclick="showAzkar('morning')">
                    🌅 أذكار الصباح
                </button>
                <button class="main-btn evening-btn" onclick="showAzkar('evening')">
                    🌙 أذكار المساء
                </button>
                <button class="main-btn back-btn-grey" onclick="showScreen('screen-home')">
                    ⬅️ رجوع
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== شاشة عرض الأذكار ==================== -->
    <div id="screen-azkar-display" class="screen">
        <div class="azkar-header">
            <button class="back-arrow" onclick="showScreen('screen-azkar-options')">➡️</button>
            <h2 id="azkarPageTitle">الأذكار</h2>
        </div>
        <div id="azkarContent" class="azkar-content"></div>
    </div>

    <!-- ==================== شاشة رسالة القرآن ==================== -->
    <div id="screen-quran-message" class="screen">
        <div class="container">
            <div class="quran-message">
                <p class="message-text">
                    هذا القرآن على روح:<br>
                    المرحوم / صابر حسن جاد<br>
                    و المرحومه / زينب محمد الفضالي<br>     <br> المرحوم / صبحي إبراهيم موسي
                </p> <br>فأقرأ لهم الفاتحه بعد اذنك
                <button class="skip-btn" onclick="goToQuran()">
                    تخطي ➡️
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== شاشة قارئ القرآن ==================== -->
    <div id="screen-quran" class="screen">
        <div class="pdf-toolbar">
            <button onclick="showScreen('screen-home')">🏠 الرئيسية</button>
            <div class="pdf-controls">
                <button onclick="scrollToPage(currentVisiblePage - 1)">⬅️ السابق</button>
                <input type="number" id="pageNum" value="1" min="1" onchange="scrollToPage(parseInt(this.value))">
                <span id="pageInfo">/ ...</span>
                <button onclick="scrollToPage(currentVisiblePage + 1)">التالي ➡️</button>
            </div>
            <div class="pdf-controls">
                <button onclick="zoomIn()">➕</button>
                <button onclick="zoomOut()">➖</button>
            </div>
        </div>
        <div id="pdfContainer" class="pdf-scroll-container">
            <div class="loading">⏳ جاري تحميل القرآن الكريم...</div>
        </div>
    </div>

    <!-- مكتبة PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        // ==================================================
        // 1. التنقل بين الشاشات
        // ==================================================
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // ==================================================
        // 2. بيانات الأذكار الجديدة (حسب الملف)
        // category: 'shared' = مشترك | 'morning' = صباح فقط | 'evening' = مساء فقط
        // ==================================================
        const azkar = [
            {
                text: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",
                count: 3,
                source: "صحيح الترمذي، 3388",
                category: "shared"
            },
            {
                text: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ",
                count: 3,
                source: "صحيح أبي داود، 5090",
                category: "shared"
            },
            {
                text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
                count: 100,
                countText: "مرة واحدة أو 100 مرة",
                source: "صحيح أبي داود، 5077 / السلسلة الصحيحة، 2762",
                category: "shared"
            },
            {
                text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
                count: 10,
                source: "السلسلة الصحيحة، 2563",
                category: "shared"
            },
            {
                text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
                count: 100,
                source: "مسلم، 2692",
                category: "shared"
            },
            {
                text: "آية الكرسي: اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ",
                count: 1,
                source: "صحيح الترغيب، 662",
                category: "shared"
            },
            {
                text: "قُلْ هُوَ اللَّهُ أَحَدٌ",
                count: 3,
                source: "صحيح الجامع، 4406",
                category: "shared"
            },
            {
                text: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",
                count: 3,
                source: "صحيح الجامع، 4406",
                category: "shared"
            },
            {
                text: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
                count: 3,
                source: "صحيح الجامع، 4406",
                category: "shared"
            },
            {
                text: "سُبْحَانَ اللَّهِ",
                count: 100,
                source: "صحيح الجامع، 4406",
                category: "shared"
            },
            {
                text: "الْحَمْدُ لِلَّهِ",
                count: 100,
                source: "صحيح الجامع، 4406",
                category: "shared"
            },
            {
                text: "اللَّهُ أَكْبَرُ",
                count: 100,
                source: "صحيح الجامع، 4406",
                category: "shared"
            },
            {
                text: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
                count: 100,
                source: "صحيح الترغيب، 658",
                category: "shared"
            },
            // ===== أذكار الصباح فقط =====
            {
                text: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا",
                count: 1,
                source: "صحيح الترغيب، 657",
                category: "morning"
            },
            {
                text: "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَمِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",
                count: 1,
                source: "السلسلة الصحيحة، 2989",
                category: "morning"
            },
            {
                text: "أَسْتَغْفِرُ اللَّهَ",
                count: 100,
                source: "السلسلة الصحيحة، 1600",
                category: "morning"
            },
            {
                text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ",
                count: 3,
                source: "مسلم، 2726",
                category: "morning"
            },
            // ===== أذكار المساء فقط =====
            {
                text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",
                count: 3,
                source: "صحيح الترغيب، 652",
                category: "evening"
            }
        ];

        // ==================================================
        // 3. عرض الأذكار مع العدّاد
        // ==================================================
        function createZikrCard(zikr, index) {
            const countDisplay = zikr.countText || (zikr.count + " مرة");
            return `
                <div class="zikr-card" id="zikr-${index}">
                    <p class="zikr-text">${zikr.text}</p>
                    <div class="zikr-footer">
                        <button class="counter-btn" onclick="decrementCounter(${index}, ${zikr.count})" id="counter-${index}">
                            <span class="counter-num">${zikr.count}</span>
                            <span class="counter-label">اضغط للعد</span>
                        </button>
                        <div class="zikr-info">
                            <span class="zikr-count-display">🔁 ${countDisplay}</span>
                            <span class="zikr-source">📚 ${zikr.source}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAzkar(filterFn, title) {
            document.getElementById('azkarPageTitle').textContent = title;
            const filtered = azkar.filter(filterFn);
            let html = '';
            filtered.forEach((zikr, index) => { html += createZikrCard(zikr, index); });
            document.getElementById('azkarContent').innerHTML = html;
            showScreen('screen-azkar-display');
        }

        function showAzkar(type) {
            if (type === 'morning') {
                renderAzkar(z => z.category === 'shared' || z.category === 'morning', '🌅 أذكار الصباح');
            } else if (type === 'evening') {
                renderAzkar(z => z.category === 'shared' || z.category === 'evening', '🌙 أذكار المساء');
            }
        }

        // ==================================================
        // 4. العدّاد التفاعلي
        // ==================================================
        function decrementCounter(index, maxCount) {
            const btn = document.getElementById('counter-' + index);
            const numSpan = btn.querySelector('.counter-num');
            let current = parseInt(numSpan.textContent);

            if (current > 1) {
                current--;
                numSpan.textContent = current;
                // تأثير بصري
                btn.classList.add('pulse');
                setTimeout(() => btn.classList.remove('pulse'), 200);
            } else if (current === 1) {
                // انتهى الذكر
                numSpan.textContent = '✓';
                btn.classList.add('completed');
                btn.querySelector('.counter-label').textContent = 'تم بحمد الله';
                btn.disabled = true;
            }
        }

        // ==================================================
        // 5. القرآن الكريم (PDF.js) - عرض Scroll متواصل
        // ==================================================
        const pdfUrl = 'quran10222.pdf';
        let pdfDoc = null;
        let scale = 1.5;
        let pdfLoaded = false;
        let currentVisiblePage = 1;
        let renderedPages = new Set();
        let pageObserver = null;

        function goToQuranMessage() {
            showScreen('screen-quran-message');
        }

        function goToQuran() {
            showScreen('screen-quran');
            if (!pdfLoaded) {
                loadPdfScroll();
                pdfLoaded = true;
            }
        }

        function loadPdfScroll() {
            const container = document.getElementById('pdfContainer');
            const pageInfo = document.getElementById('pageInfo');
            const pageNumInput = document.getElementById('pageNum');

            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
                pdfDoc = pdf;
                pageInfo.textContent = '/ ' + pdf.numPages;
                pageNumInput.max = pdf.numPages;
                container.innerHTML = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'pdf-page';
                    pageDiv.id = 'pdf-page-' + i;
                    pageDiv.dataset.pageNum = i;
                    pageDiv.style.minHeight = '600px';
                    container.appendChild(pageDiv);
                }

                setupLazyLoading();
                renderPdfPage(1);
                renderPdfPage(2);
                renderPdfPage(3);
            }).catch(function(error) {
                container.innerHTML = '<div class="loading">❌ خطأ في تحميل الملف: ' + error.message + '</div>';
            });
        }

        function renderPdfPage(pageNum) {
            if (renderedPages.has(pageNum)) return;
            if (pageNum < 1 || (pdfDoc && pageNum > pdfDoc.numPages)) return;
            const pageDiv = document.getElementById('pdf-page-' + pageNum);
            if (!pageDiv) return;
            renderedPages.add(pageNum);

            pdfDoc.getPage(pageNum).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                canvas.style.display = 'block';

                page.render({ canvasContext: context, viewport: viewport }).promise.then(function() {
                    pageDiv.innerHTML = '';
                    pageDiv.appendChild(canvas);
                    pageDiv.classList.add('loaded');
                    pageDiv.style.minHeight = 'auto';
                });
            });
        }

        function setupLazyLoading() {
            const options = { root: null, rootMargin: '800px 0px', threshold: 0 };
            pageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageNum = parseInt(entry.target.dataset.pageNum);
                        renderPdfPage(pageNum);
                        renderPdfPage(pageNum + 1);
                        renderPdfPage(pageNum - 1);
                    }
                });
            }, options);
            document.querySelectorAll('.pdf-page').forEach(page => pageObserver.observe(page));
            window.addEventListener('scroll', updateCurrentPage, { passive: true });
        }

        function updateCurrentPage() {
            const screenQuran = document.getElementById('screen-quran');
            if (!screenQuran.classList.contains('active')) return;
            const pages = document.querySelectorAll('.pdf-page');
            const scrollMiddle = window.scrollY + window.innerHeight / 3;
            for (let page of pages) {
                const rect = page.getBoundingClientRect();
                const pageTop = rect.top + window.scrollY;
                const pageBottom = pageTop + rect.height;
                if (scrollMiddle >= pageTop && scrollMiddle <= pageBottom) {
                    const num = parseInt(page.dataset.pageNum);
                    if (currentVisiblePage !== num) {
                        currentVisiblePage = num;
                        document.getElementById('pageNum').value = num;
                    }
                    break;
                }
            }
        }

        function scrollToPage(num) {
            if (!pdfDoc || num < 1 || num > pdfDoc.numPages) return;
            const pageDiv = document.getElementById('pdf-page-' + num);
            if (pageDiv) {
                renderPdfPage(num);
                setTimeout(() => {
                    pageDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    currentVisiblePage = num;
                    document.getElementById('pageNum').value = num;
                }, 100);
            }
        }

        function zoomIn() {
            if (!pdfDoc) return;
            scale += 0.25;
            redrawAllPages();
        }

        function zoomOut() {
            if (!pdfDoc || scale <= 0.5) return;
            scale -= 0.25;
            redrawAllPages();
        }

        function redrawAllPages() {
            const pagesToRedraw = Array.from(renderedPages);
            renderedPages.clear();
            pagesToRedraw.forEach(num => {
                const pageDiv = document.getElementById('pdf-page-' + num);
                if (pageDiv) {
                    pageDiv.innerHTML = '';
                    pageDiv.style.minHeight = '600px';
                    pageDiv.classList.remove('loaded');
                }
            });
            pagesToRedraw.forEach(num => renderPdfPage(num));
        }
    </script>
</body>
</html>
